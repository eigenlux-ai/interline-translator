<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Interline · 行間 —— オープンソースの Chrome 対訳リーディング拡張機能</title>
  <desc id="hero-desc">Interline の紹介画像：段落の下にその場で対訳を表示し、元のWebページレイアウトを維持します。</desc>

  <rect x="0.5" y="0.5" width="1199" height="399" rx="26" fill="#FAF6EE" stroke="#CFC4B0"/>

  <g id="title-block">
    <text x="64" y="64" font-family="-apple-system, BlinkMacSystemFont, &quot;Hiragino Sans&quot;, &quot;Yu Gothic UI&quot;, sans-serif" font-size="18" letter-spacing="3" fill="#74695B">オープンソース拡張機能 · CHROME MV3</text>

    <text x="64" y="152" font-family="Georgia, &quot;Songti SC&quot;, serif" font-size="78" fill="#211C15">Interline</text>

    <rect x="66" y="178" width="3.5" height="46" rx="1.75" fill="#C2402A"/>
    <text x="88" y="214" font-family="Georgia, &quot;Songti SC&quot;, serif" font-size="42" letter-spacing="4" fill="#C2402A">行間</text>

    <text x="64" y="282" font-family="-apple-system, BlinkMacSystemFont, &quot;Hiragino Sans&quot;, sans-serif" font-size="26" font-weight="500" fill="#3A332A">段落の下にその場で対訳を表示 ——</text>
    <text x="64" y="318" font-family="-apple-system, BlinkMacSystemFont, &quot;Hiragino Sans&quot;, sans-serif" font-size="26" fill="#574E42">元のレイアウトを崩さず、サイドバーも不要。</text>

    <text x="64" y="358" font-family="-apple-system, BlinkMacSystemFont, &quot;Hiragino Sans&quot;, sans-serif" font-size="18" letter-spacing="1.4" fill="#74695B">MIT ライセンス · 無料エンジン内蔵 · テレメトリなし</text>
  </g>

  <g id="page-sample">
    <rect x="620.5" y="56.5" width="515" height="287" rx="14" fill="#FFFDF8" stroke="#CFC4B0"/>

    <g id="seal" transform="translate(1032 74) scale(0.72)">
      <rect width="100" height="100" rx="21" fill="#A8241C"/>
      <line x1="16" y1="25" x2="84" y2="25" stroke="#FFFDF8" stroke-width="10" stroke-linecap="round"/>
      <g font-family="-apple-system, &quot;Hiragino Sans&quot;, sans-serif" font-size="25" font-weight="600" fill="#FFFDF8" text-anchor="middle">
        <text x="26" y="63">文</text>
        <text x="50" y="63">A</text>
        <text x="74" y="63">あ</text>
      </g>
      <line x1="16" y1="79" x2="84" y2="79" stroke="#FFFDF8" stroke-width="10" stroke-linecap="round"/>
    </g>

    <g font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="21" fill="#211C15">
      <text x="652" y="118">Good tools never interrupt your flow.</text>
      <text x="652" y="150">They surface information in context</text>
      <text x="652" y="182">without breaking the original page.</text>
    </g>

    <rect x="652" y="204" width="3.5" height="62" rx="1.75" fill="#C2402A"/>
    <g font-family="Georgia, &quot;Yu Gothic&quot;, serif" font-size="20" fill="#3A332A">
      <text x="674" y="228">優れたツールは読むリズムを邪魔しません。</text>
      <text x="674" y="258">文脈に合わせてその場で訳文を表示します。</text>
    </g>

    <line x1="652" y1="292" x2="1104" y2="292" stroke="#CFC4B0"/>
    <text x="652" y="318" font-family="-apple-system, BlinkMacSystemFont, &quot;Hiragino Sans&quot;, sans-serif" font-size="17" letter-spacing="1" fill="#74695B">瞬時に表示切り替え · 再翻訳不要</text>
  </g>
</svg>
