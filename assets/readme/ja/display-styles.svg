<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="712" viewBox="0 0 1200 712"
     role="img" aria-labelledby="ds-title ds-desc">
  <title id="ds-title">訳文の10種類の表示スタイル</title>
  <desc id="ds-desc">同一の訳文を10種類のスタイル（ブレンド、薄く表示、下線、破線、点線、波線、ハイライト、引用バー、カード、ぼかし）で表示し、ダークテーマでのコントラストも確認できる見本ボードです。</desc>

  <rect x="0.5" y="0.5" width="1199" height="711" rx="26" fill="#FAF6EE" stroke="#CFC4B0"/>

  <text x="64" y="62" font-family="-apple-system, BlinkMacSystemFont, &quot;Hiragino Sans&quot;, sans-serif" font-size="18" letter-spacing="3.2" fill="#74695B">表示スタイル</text>
  <text x="1136" y="62" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, &quot;Hiragino Sans&quot;, sans-serif" font-size="18" fill="#74695B">ライト・ダーク両方のページでコントラストを確認済み</text>

  <g id="column-one" font-family="-apple-system, BlinkMacSystemFont, &quot;Hiragino Sans&quot;, sans-serif" font-size="18" fill="#74695B">
    <text x="64" y="128">ブレンド</text>
    <text x="64" y="206">薄く表示</text>
    <text x="64" y="284">下線</text>
    <text x="64" y="362">破線</text>
    <text x="64" y="440">点線</text>
  </g>

  <g id="column-one-samples" font-family="Georgia, &quot;Yu Gothic&quot;, serif" font-size="22" fill="#3A332A">
    <text x="210" y="128">これは翻訳文の例です</text>
    <text x="210" y="206" opacity="0.5">これは翻訳文の例です</text>
    <text x="210" y="284">これは翻訳文の例です</text>
    <line x1="210" y1="292" x2="430" y2="292" stroke="#C2402A" stroke-width="1.6"/>
    <text x="210" y="362">これは翻訳文の例です</text>
    <line x1="210" y1="370" x2="430" y2="370" stroke="#C2402A" stroke-width="1.6" stroke-dasharray="7 5"/>
    <text x="210" y="440">これは翻訳文の例です</text>
    <line x1="210" y1="449" x2="430" y2="449" stroke="#C2402A" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="0.1 6.5"/>
  </g>

  <g id="column-two" font-family="-apple-system, BlinkMacSystemFont, &quot;Hiragino Sans&quot;, sans-serif" font-size="18" fill="#74695B">
    <text x="624" y="128">波線</text>
    <text x="624" y="206">ハイライト</text>
    <text x="624" y="284">引用バー</text>
    <text x="624" y="362">カード</text>
    <text x="624" y="440">ぼかし</text>
  </g>

  <g id="column-two-samples" font-family="Georgia, &quot;Yu Gothic&quot;, serif" font-size="22" fill="#3A332A">
    <text x="770" y="128">これは翻訳文の例です</text>
    <path d="M 770 136 q 4.5 -5 9 0 t 9 0 t 9 0 t 9 0 t 9 0 t 9 0 t 9 0 t 9 0 t 9 0 t 9 0 t 9 0 t 9 0 t 9 0" fill="none" stroke="#C2402A" stroke-width="1.6"/>

    <rect x="764" y="186" width="232" height="28" rx="3" fill="#C2402A" opacity="0.12"/>
    <text x="770" y="206">これは翻訳文の例です</text>

    <rect x="770" y="264" width="3.5" height="26" rx="1.75" fill="#C2402A"/>
    <text x="786" y="284">これは翻訳文の例です</text>

    <rect x="760.5" y="338.5" width="238" height="35" rx="8" fill="#FFFDF8" stroke="#CFC4B0"/>
    <text x="770" y="362">これは翻訳文の例です</text>

    <text x="770" y="440" opacity="0.26">これは翻訳文の例です</text>
    <text x="1016" y="440" font-family="-apple-system, BlinkMacSystemFont, &quot;Hiragino Sans&quot;, sans-serif" font-size="16" fill="#74695B">ホバーで表示</text>
  </g>

  <line x1="64" y1="492" x2="1136" y2="492" stroke="#CFC4B0"/>

  <g id="dark-page">
    <rect x="64" y="516" width="1072" height="152" rx="14" fill="#16130E"/>
    <text x="96" y="552" font-family="-apple-system, BlinkMacSystemFont, &quot;Hiragino Sans&quot;, sans-serif" font-size="18" letter-spacing="2.4" fill="#7D7464">ダークテーマのページでの表示例</text>

    <g font-family="-apple-system, BlinkMacSystemFont, &quot;Hiragino Sans&quot;, sans-serif" font-size="18" fill="#7D7464">
      <text x="96" y="604">ブレンド</text>
      <text x="96" y="648">カード</text>
      <text x="616" y="604">ハイライト</text>
      <text x="616" y="648">ぼかし</text>
    </g>

    <g font-family="Georgia, &quot;Yu Gothic&quot;, serif" font-size="22" fill="#D8CFBE">
      <text x="232" y="604">これは翻訳文の例です</text>

      <rect x="222.5" y="624.5" width="238" height="33" rx="8" fill="#1E1A14" stroke="#2D2820"/>
      <text x="232" y="648">これは翻訳文の例です</text>

      <rect x="746" y="584" width="232" height="28" rx="3" fill="#E2614A" opacity="0.18"/>
      <text x="752" y="604">これは翻訳文の例です</text>

      <text x="752" y="648" opacity="0.3">これは翻訳文の例です</text>
    </g>
  </g>
</svg>
