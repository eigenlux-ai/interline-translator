<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="712" viewBox="0 0 1200 712"
     role="img" aria-labelledby="ds-title ds-desc">
  <title id="ds-title">번역문의 10가지 표시 스타일</title>
  <desc id="ds-desc">동일한 번역문을 10가지 스타일(자연스럽게, 연하게, 밑줄, 파선, 점선, 물결선, 형광펜, 인용 바, 카드, 블러)로 표시하고, 다크 모드에서의 명암비도 확인할 수 있는 예시 보드입니다.</desc>

  <rect x="0.5" y="0.5" width="1199" height="711" rx="26" fill="#FAF6EE" stroke="#CFC4B0"/>

  <text x="64" y="62" font-family="-apple-system, BlinkMacSystemFont, &quot;Apple SD Gothic Neo&quot;, sans-serif" font-size="18" letter-spacing="3.2" fill="#74695B">표시 스타일</text>
  <text x="1136" y="62" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, &quot;Apple SD Gothic Neo&quot;, sans-serif" font-size="18" fill="#74695B">라이트/다크 모드 페이지에서 대비 확인 완료</text>

  <g id="column-one" font-family="-apple-system, BlinkMacSystemFont, &quot;Apple SD Gothic Neo&quot;, sans-serif" font-size="18" fill="#74695B">
    <text x="64" y="128">자연스럽게</text>
    <text x="64" y="206">연하게</text>
    <text x="64" y="284">밑줄</text>
    <text x="64" y="362">파선</text>
    <text x="64" y="440">점선</text>
  </g>

  <g id="column-one-samples" font-family="Georgia, &quot;Batang&quot;, serif" font-size="22" fill="#3A332A">
    <text x="210" y="128">번역된 문장 예시입니다</text>
    <text x="210" y="206" opacity="0.5">번역된 문장 예시입니다</text>
    <text x="210" y="284">번역된 문장 예시입니다</text>
    <line x1="210" y1="292" x2="450" y2="292" stroke="#C2402A" stroke-width="1.6"/>
    <text x="210" y="362">번역된 문장 예시입니다</text>
    <line x1="210" y1="370" x2="450" y2="370" stroke="#C2402A" stroke-width="1.6" stroke-dasharray="7 5"/>
    <text x="210" y="440">번역된 문장 예시입니다</text>
    <line x1="210" y1="449" x2="450" y2="449" stroke="#C2402A" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="0.1 6.5"/>
  </g>

  <g id="column-two" font-family="-apple-system, BlinkMacSystemFont, &quot;Apple SD Gothic Neo&quot;, sans-serif" font-size="18" fill="#74695B">
    <text x="624" y="128">물결선</text>
    <text x="624" y="206">형광펜</text>
    <text x="624" y="284">인용 바</text>
    <text x="624" y="362">카드</text>
    <text x="624" y="440">블러</text>
  </g>

  <g id="column-two-samples" font-family="Georgia, &quot;Batang&quot;, serif" font-size="22" fill="#3A332A">
    <text x="770" y="128">번역된 문장 예시입니다</text>
    <path d="M 770 136 q 4.5 -5 9 0 t 9 0 t 9 0 t 9 0 t 9 0 t 9 0 t 9 0 t 9 0 t 9 0 t 9 0 t 9 0 t 9 0 t 9 0" fill="none" stroke="#C2402A" stroke-width="1.6"/>

    <rect x="764" y="186" width="245" height="28" rx="3" fill="#C2402A" opacity="0.12"/>
    <text x="770" y="206">번역된 문장 예시입니다</text>

    <rect x="770" y="264" width="3.5" height="26" rx="1.75" fill="#C2402A"/>
    <text x="786" y="284">번역된 문장 예시입니다</text>

    <rect x="760.5" y="338.5" width="255" height="35" rx="8" fill="#FFFDF8" stroke="#CFC4B0"/>
    <text x="770" y="362">번역된 문장 예시입니다</text>

    <text x="770" y="440" opacity="0.26">번역된 문장 예시입니다</text>
    <text x="1036" y="440" font-family="-apple-system, BlinkMacSystemFont, &quot;Apple SD Gothic Neo&quot;, sans-serif" font-size="16" fill="#74695B">마우스 오버</text>
  </g>

  <line x1="64" y1="492" x2="1136" y2="492" stroke="#CFC4B0"/>

  <g id="dark-page">
    <rect x="64" y="516" width="1072" height="152" rx="14" fill="#16130E"/>
    <text x="96" y="552" font-family="-apple-system, BlinkMacSystemFont, &quot;Apple SD Gothic Neo&quot;, sans-serif" font-size="18" letter-spacing="2.4" fill="#7D7464">다크 모드 페이지에서의 표시 예시</text>

    <g font-family="-apple-system, BlinkMacSystemFont, &quot;Apple SD Gothic Neo&quot;, sans-serif" font-size="18" fill="#7D7464">
      <text x="96" y="604">자연스럽게</text>
      <text x="96" y="648">카드</text>
      <text x="616" y="604">형광펜</text>
      <text x="616" y="648">블러</text>
    </g>

    <g font-family="Georgia, &quot;Batang&quot;, serif" font-size="22" fill="#D8CFBE">
      <text x="232" y="604">번역된 문장 예시입니다</text>

      <rect x="222.5" y="624.5" width="255" height="33" rx="8" fill="#1E1A14" stroke="#2D2820"/>
      <text x="232" y="648">번역된 문장 예시입니다</text>

      <rect x="746" y="584" width="245" height="28" rx="3" fill="#E2614A" opacity="0.18"/>
      <text x="752" y="604">번역된 문장 예시입니다</text>

      <text x="752" y="648" opacity="0.3">번역된 문장 예시입니다</text>
    </g>
  </g>
</svg>
