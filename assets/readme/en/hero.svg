<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Interline · 行间 — open-source in-place bilingual reading extension</title>
  <desc id="hero-desc">Interline hero banner showing in-place bilingual reading with translations placed beneath paragraphs while preserving the original page layout.</desc>

  <rect x="0.5" y="0.5" width="1199" height="399" rx="26" fill="#FAF6EE" stroke="#CFC4B0"/>

  <g id="title-block">
    <text x="64" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="3.2" fill="#74695B">OPEN SOURCE EXTENSION · CHROME MV3</text>

    <text x="64" y="152" font-family="Georgia, &quot;Songti SC&quot;, serif" font-size="78" fill="#211C15">Interline</text>

    <rect x="66" y="178" width="3.5" height="46" rx="1.75" fill="#C2402A"/>
    <text x="88" y="214" font-family="Georgia, &quot;Songti SC&quot;, serif" font-size="42" letter-spacing="4" fill="#C2402A">行间</text>

    <text x="64" y="282" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="26" font-weight="500" fill="#3A332A">In-place bilingual reading for any page —</text>
    <text x="64" y="318" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="26" fill="#574E42">no sidebars, zero layout shifts.</text>

    <text x="64" y="358" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="1.4" fill="#74695B">MIT LICENSE · BUILT-IN FREE ENGINE · ZERO TRACKING</text>
  </g>

  <g id="page-sample">
    <rect x="620.5" y="56.5" width="515" height="287" rx="14" fill="#FFFDF8" stroke="#CFC4B0"/>

    <g id="seal" transform="translate(1032 74) scale(0.72)">
      <rect width="100" height="100" rx="21" fill="#A8241C"/>
      <line x1="16" y1="25" x2="84" y2="25" stroke="#FFFDF8" stroke-width="10" stroke-linecap="round"/>
      <g font-family="-apple-system, &quot;PingFang SC&quot;, sans-serif" font-size="25" font-weight="600" fill="#FFFDF8" text-anchor="middle">
        <text x="26" y="63">文</text>
        <text x="50" y="63">A</text>
        <text x="74" y="63">あ</text>
      </g>
      <line x1="16" y1="79" x2="84" y2="79" stroke="#FFFDF8" stroke-width="10" stroke-linecap="round"/>
    </g>

    <g font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="21" fill="#211C15">
      <text x="652" y="118">Good tools never interrupt your flow.</text>
      <text x="652" y="150">They surface information in context</text>
      <text x="652" y="182">without breaking the original page.</text>
    </g>

    <rect x="652" y="204" width="3.5" height="62" rx="1.75" fill="#C2402A"/>
    <g font-family="Georgia, &quot;Songti SC&quot;, serif" font-size="21" fill="#3A332A">
      <text x="674" y="228">优秀的工具从不打断阅读心流。</text>
      <text x="674" y="258">译文就地呈现，原网页排版完整如初。</text>
    </g>

    <line x1="652" y1="292" x2="1104" y2="292" stroke="#CFC4B0"/>
    <text x="652" y="318" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="0.8" fill="#74695B">instant view toggling · no re-translation</text>
  </g>
</svg>
