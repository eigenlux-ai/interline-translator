<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="712" viewBox="0 0 1200 712"
     role="img" aria-labelledby="ds-title ds-desc">
  <title id="ds-title">Ten display styles for the translated text</title>
  <desc id="ds-desc">A sample board. The same Chinese sentence is shown ten times to compare the blend, dim, underline, dashed, dotted, wavy, highlight, blockquote, card and blur display styles, then four of them are repeated on a dark page to show that contrast holds in both colour schemes.</desc>

  <rect x="0.5" y="0.5" width="1199" height="711" rx="26" fill="#FAF6EE" stroke="#CFC4B0"/>

  <text x="64" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="3.2" fill="#74695B">DISPLAY STYLES</text>
  <text x="1136" y="62" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#74695B">checked on light and dark pages</text>

  <g id="column-one" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#74695B">
    <text x="64" y="128">blend</text>
    <text x="64" y="206">dim</text>
    <text x="64" y="284">underline</text>
    <text x="64" y="362">dashed</text>
    <text x="64" y="440">dotted</text>
  </g>

  <g id="column-one-samples" font-family="Georgia, &quot;Songti SC&quot;, serif" font-size="22" fill="#3A332A">
    <text x="210" y="128">这是一句译文</text>
    <text x="210" y="206" opacity="0.5">这是一句译文</text>
    <text x="210" y="284">这是一句译文</text>
    <line x1="210" y1="292" x2="342" y2="292" stroke="#C2402A" stroke-width="1.6"/>
    <text x="210" y="362">这是一句译文</text>
    <line x1="210" y1="370" x2="342" y2="370" stroke="#C2402A" stroke-width="1.6" stroke-dasharray="7 5"/>
    <text x="210" y="440">这是一句译文</text>
    <line x1="210" y1="449" x2="342" y2="449" stroke="#C2402A" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="0.1 6.5"/>
  </g>

  <g id="column-two" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#74695B">
    <text x="624" y="128">wavy</text>
    <text x="624" y="206">highlight</text>
    <text x="624" y="284">blockquote</text>
    <text x="624" y="362">card</text>
    <text x="624" y="440">blur</text>
  </g>

  <g id="column-two-samples" font-family="Georgia, &quot;Songti SC&quot;, serif" font-size="22" fill="#3A332A">
    <text x="770" y="128">这是一句译文</text>
    <path d="M 770 136 q 4.5 -5 9 0 t 9 0 t 9 0 t 9 0 t 9 0 t 9 0 t 9 0 t 9 0 t 9 0 t 9 0 t 9 0 t 9 0 t 9 0 t 9 0" fill="none" stroke="#C2402A" stroke-width="1.6"/>

    <rect x="764" y="186" width="144" height="28" rx="3" fill="#C2402A" opacity="0.12"/>
    <text x="770" y="206">这是一句译文</text>

    <rect x="770" y="264" width="3.5" height="26" rx="1.75" fill="#C2402A"/>
    <text x="786" y="284">这是一句译文</text>

    <rect x="760.5" y="338.5" width="151" height="35" rx="8" fill="#FFFDF8" stroke="#CFC4B0"/>
    <text x="770" y="362">这是一句译文</text>

    <text x="770" y="440" opacity="0.26">这是一句译文</text>
    <text x="920" y="440" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#74695B">hover to reveal</text>
  </g>

  <line x1="64" y1="492" x2="1136" y2="492" stroke="#CFC4B0"/>

  <g id="dark-page">
    <rect x="64" y="516" width="1072" height="152" rx="14" fill="#16130E"/>
    <text x="96" y="552" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2.4" fill="#7D7464">THE SAME STYLES ON A DARK PAGE</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#7D7464">
      <text x="96" y="604">blend</text>
      <text x="96" y="648">card</text>
      <text x="616" y="604">highlight</text>
      <text x="616" y="648">blur</text>
    </g>

    <g font-family="Georgia, &quot;Songti SC&quot;, serif" font-size="22" fill="#D8CFBE">
      <text x="232" y="604">这是一句译文</text>

      <rect x="222.5" y="624.5" width="151" height="33" rx="8" fill="#1E1A14" stroke="#2D2820"/>
      <text x="232" y="648">这是一句译文</text>

      <rect x="746" y="584" width="144" height="28" rx="3" fill="#E2614A" opacity="0.18"/>
      <text x="752" y="604">这是一句译文</text>

      <text x="752" y="648" opacity="0.3">这是一句译文</text>
    </g>
  </g>
</svg>
