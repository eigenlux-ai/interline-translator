name: Feature request
description: Suggest an addition or improvement to Interline
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for Interline? Tell us what you want to read, understand or write, and what gets in the way. You do not need an implementation plan. Requests in English, Chinese, Japanese or Korean are welcome.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the reading or translation friction you hit, and on what kind of page.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: 'Optional: what would you like Interline to do?'
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why they fall short.
  - type: textarea
    id: context
    attributes:
      label: Examples or additional context
      description: Optional public examples, sketches or related issues. Please omit API keys and private content.
