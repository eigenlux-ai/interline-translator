name: Feature request
description: Suggest an addition or improvement to Interline
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Interline aims to stay a quiet reading tool: the translation sits between the lines and the host page is never disturbed. Proposals that keep the surface small and the reading undisturbed are the most likely to land.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the reading or translation friction you hit, and on what kind of page.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like Interline to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why they fall short.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This does not require new browser permissions beyond `storage`, `contextMenus`, and `alarms`.
        - label: This does not send page text anywhere other than the engine the user configured.
