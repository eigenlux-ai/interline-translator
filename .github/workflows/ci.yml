# The backstop the guardrails assume exists: lint can be bypassed with a
# disable comment and audit:ascii is by design a fail-open tripwire — they only
# guard anything if something runs them on every push. This chain mirrors the
# local pre-commit checklist, plus the two audits that were manual-only before.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # reads the version from packageManager

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile # postinstall runs `wxt prepare`

      - run: pnpm compile
      - run: pnpm lint
      - run: pnpm prettier:check
      - run: pnpm test
      - run: pnpm zip # check-prefix-sync fails the build on prefix drift
      - run: pnpm audit:css
      - run: pnpm audit:surface
      - run: pnpm audit:ascii
      - run: pnpm audit:bundle
      - run: pnpm zip:firefox
      - run: pnpm audit:css:firefox
      - run: pnpm audit:surface:firefox
      - run: pnpm audit:ascii:firefox
      - run: pnpm audit:repro:firefox
      - name: Verify zip archives exist and exclude audit-only surface-css
        run: |
          node -e '
            const { execFileSync } = require("node:child_process");
            const { existsSync, readFileSync } = require("node:fs");
            const { name, version } = JSON.parse(readFileSync("package.json", "utf8"));
            for (const target of ["chrome", "firefox"]) {
              const zip = `.output/${name}-${version}-${target}.zip`;
              if (!existsSync(zip)) throw new Error(`Missing expected package archive: ${zip}`);
              const list = execFileSync("unzip", ["-Z1", zip], { encoding: "utf8" });
              if (list.split(/\r?\n/).some((entry) => entry.startsWith("surface-css/"))) {
                throw new Error(`${zip} must exclude surface-css/`);
              }
            }
          '
